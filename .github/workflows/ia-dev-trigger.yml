name: 'IA DEV Trigger'
on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'ia-dev')
    runs-on: ubuntu-24.04
    outputs:
      issue: ${{ steps.validate.outputs.issue }}
    steps:
      - name: Validate issue
        id: validate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ github.event.inputs.issue }}" >> $GITHUB_OUTPUT
          else
            echo "issue=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

  execute:
    needs: check
    uses: davidsegade/ia-dev-architecture-lab/.github/workflows/ia-dev-execute.yml@be7905978a8ae4ad520af981944725e7e460ef60
    with:
      target-repo: davidsegade/TURNEO-Flutter
      issue-number: ${{ needs.check.outputs.issue }}
    secrets:
      target-token: ${{ secrets.GITHUB_TOKEN }}