name: 'IA DEV Trigger'
on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'ia-dev')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ github.event.inputs.issue }}" >> $GITHUB_OUTPUT
          else
            echo "issue=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi
        id: validate

  dispatch:
    needs: check
    if: needs.check.outputs.issue != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Debug check output
        run: |
          echo "Check output issue: '${{ needs.check.outputs.issue }}'"
      - name: Dispatch IA DEV workflow
        run: |
          gh api -X POST repos/davidsegade/ia-dev-architecture-lab/actions/workflows/ia-dev-execute.yml/dispatches \
            -f ref=main \
            -f "inputs[target-repo]=davidsegade/TURNEO-Flutter" \
            -f "inputs[issue-number]=${{ needs.check.outputs.issue }}" \
            -f "inputs[automatic]=false"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}