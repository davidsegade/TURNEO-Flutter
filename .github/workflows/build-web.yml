name: Build Flutter Web

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Ensure web platform
        run: flutter create --platforms=web --project-name turneo .
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test shift-register validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/shift-register/validation_test.ts
      - name: Supabase configuration preflight
        env:
          SUPABASE_URL: https://iiaxbriosudkmhsqvksn.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 tool/check_config.py
      - name: Build web
        run: flutter build web --release --dart-define-from-file=build-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: turneo-web
          path: build/web
          retention-days: 14
